name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/WebAPI

    - name: Build project
      run: dotnet build src/WebAPI --no-restore --configuration Release

    - name: Start Web API in background
      run: |
        dotnet run --project src/WebAPI &
        sleep 5

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Newman
      run: npm install -g newman

    - name: Run Postman Tests via Newman
      run: newman run ServerPulse.postman_collection.json --env-var "baseUrl=http://localhost:5056"
